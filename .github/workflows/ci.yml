name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-module:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell sources (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\KhzJanitor\KhzJanitor.psm1',
            '.\KhzJanitor\KhzJanitor.psd1',
            '.\install.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List *
              throw "PowerShell parse errors in $path"
            }
          }

      - name: Validate and import module (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = '.\KhzJanitor\KhzJanitor.psd1'
          $metadata = Test-ModuleManifest $manifest -ErrorAction Stop
          Import-Module $manifest -Force -ErrorAction Stop
          $actual = @(Get-Command -Module KhzJanitor | Select-Object -ExpandProperty Name | Sort-Object)
          $expected = @($metadata.ExportedFunctions.Keys | Sort-Object)
          if (Compare-Object $expected $actual) {
            throw "Exported command set does not match the module manifest."
          }
          if ($actual.Count -eq 0) {
            throw "Module imported without exported commands."
          }
          Write-Host "EXPORTED_FUNCTIONS=$($actual.Count)"

      - name: Verify failed deletion is not counted as reclaimed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module '.\KhzJanitor\KhzJanitor.psd1' -Force -ErrorAction Stop

          $root = Join-Path $env:RUNNER_TEMP 'khz-janitor-locked-delete'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $saved = @{
            SystemRoot   = $env:SystemRoot
            SystemDrive  = $env:SystemDrive
            ProgramData  = $env:ProgramData
            LOCALAPPDATA = $env:LOCALAPPDATA
          }

          try {
            $env:SystemRoot = $root
            $env:SystemDrive = $root
            $env:ProgramData = $root
            $env:LOCALAPPDATA = $root

            $dump = Join-Path $root 'MEMORY.DMP'
            [IO.File]::WriteAllBytes($dump, [byte[]](1..32))
            $stream = [IO.File]::Open(
              $dump,
              [IO.FileMode]::Open,
              [IO.FileAccess]::ReadWrite,
              [IO.FileShare]::None
            )
            try {
              $reclaimed = [int64](Clear-KhzLogs -Apply)
              if ($reclaimed -ne 0) {
                throw "locked dump was incorrectly counted as reclaimed: $reclaimed"
              }
              if (-not (Test-Path -LiteralPath $dump)) {
                throw 'locked dump unexpectedly disappeared'
              }
            } finally {
              $stream.Dispose()
            }
          } finally {
            $env:SystemRoot = $saved.SystemRoot
            $env:SystemDrive = $saved.SystemDrive
            $env:ProgramData = $saved.ProgramData
            $env:LOCALAPPDATA = $saved.LOCALAPPDATA
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Parse PowerShell sources (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\KhzJanitor\KhzJanitor.psm1',
            '.\KhzJanitor\KhzJanitor.psd1',
            '.\install.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List *
              throw "PowerShell parse errors in $path"
            }
          }

      - name: Validate and import module (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = '.\KhzJanitor\KhzJanitor.psd1'
          $metadata = Test-ModuleManifest $manifest -ErrorAction Stop
          Import-Module $manifest -Force -ErrorAction Stop
          $actual = @(Get-Command -Module KhzJanitor | Select-Object -ExpandProperty Name | Sort-Object)
          $expected = @($metadata.ExportedFunctions.Keys | Sort-Object)
          if (Compare-Object $expected $actual) {
            throw "Exported command set does not match the module manifest."
          }
          if ($actual.Count -eq 0) {
            throw "Module imported without exported commands."
          }
          Write-Host "EXPORTED_FUNCTIONS=$($actual.Count)"
